[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ones-gfx-sdk"
version = "1.0.0"
description = "Python SDK for the AVIZ ONES Spectrum-X tenant management API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "AVIZ Networks" },
]
keywords = ["ones", "spectrumx", "nvidia", "networking", "sdk", "tenant", "gpu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/aviznetworks/ones-gfx-sdk"
Documentation = "https://github.com/aviznetworks/ones-gfx-sdk"
Issues = "https://github.com/aviznetworks/ones-gfx-sdk/issues"

[tool.setuptools.packages.find]
include = ["ones_gfx*"]
exclude = ["examples*", "tests*"]
